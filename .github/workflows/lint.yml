name: Markdown & Mermaid Linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run arch-map markdown & mermaid linter
        run: python3 arch_map.py --lint .

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
